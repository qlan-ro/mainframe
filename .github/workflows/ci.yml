# .github/workflows/ci.yml
name: CI

# PR-only: merges re-landing on main were already tested on the PR, and main
# only moves via PRs (plus the release-prep bot commit, which touches only
# changelogs/docs). Re-running the suite post-merge doubled every run.
on:
  pull_request:
    branches: [main]
    # `labeled` is the version PR's e2e button: adding the `run-e2e` label runs
    # the mock e2e suite in THIS run, so its result is the PR's own check.
    # Any other label just re-runs CI on the same head.
    types: [opened, synchronize, reopened, labeled]

# A new push to the same PR supersedes the in-flight run — cancel it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `node --test <dir>` treats a directory argument as a module path and
      # doesn't recurse (Node 22/24, verified), and a glob that matches nothing
      # exits 0 — so the files are expanded and counted before running, or a
      # moved test file would silently disable this gate.
      - name: Skill helper tests and consumed-surface citations
        run: |
          tests=(.claude/skills/changelog-watch/scripts/*.test.mjs)
          if [ ! -e "${tests[0]}" ]; then
            echo "no changelog-watch helper tests found — the gate would pass vacuously" >&2
            exit 1
          fi
          node --test "${tests[@]}"
          node .claude/skills/changelog-watch/scripts/check-surface.mjs

      # types/dist is an import target for the other packages — a plain tsc
      # emit, no bundling.
      - name: Build workspace dependencies
        run: pnpm build:types

      - name: Type check
        run: pnpm --filter @qlan-ro/mainframe-ui typecheck

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui
            command: pnpm --filter @qlan-ro/mainframe-ui exec vitest run --maxWorkers=4
          - name: types
            command: pnpm --filter @qlan-ro/mainframe-types exec vitest run --maxWorkers=4
          - name: e2e-tools
            command: pnpm --filter @qlan-ro/mainframe-e2e run test:tools

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace dependencies
        run: pnpm build:types

      - name: Test
        run: ${{ matrix.command }}

  changeset-check:
    if: github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: git fetch origin main

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # This job only runs `changeset status`, which reads .changeset/ and git
      # history. Skip lifecycle scripts so it doesn't need a native toolchain
      # (node-pty / better-sqlite3 builds) that the minimal runner lacks.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changeset
        run: pnpm changeset status --since=origin/main

  # The mock e2e suite gates ONLY the changesets version PR: that PR is the
  # last stop before a release, and a red suite after merging it means a
  # merged version bump and a failed release. It does not run on every update
  # of that PR (the branch is force-pushed after every merge to main); adding
  # the `run-e2e` label runs it on the current head instead (`run`). Until it
  # has passed on the head, the version PR gets `require-manual`, which fails
  # with a pointer to the label. Feature PRs get `skip` (a skipped job
  # satisfies the required check) unless labelled too. The decision is passed
  # INTO the reusable workflow rather than put on this job: a `uses:` job
  # skipped here reports as "e2e-mock", but when it runs the check is
  # "e2e-mock / e2e-mock" — deciding inside keeps the one name main's ruleset
  # requires.
  e2e-mock:
    uses: ./.github/workflows/e2e-mock.yml
    with:
      mode: ${{ (github.event.action == 'labeled' && github.event.label.name == 'run-e2e') && 'run' || (github.head_ref == 'changeset-release/main' && 'require-manual' || 'skip') }}

  # Take the label straight back off, so adding it again runs the suite on a
  # later head. Done at the start, not after the suite: a run cancelled by a
  # force-push must not leave the label on with nothing running.
  consume-run-e2e-label:
    if: ${{ github.event.action == 'labeled' && github.event.label.name == 'run-e2e' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${GITHUB_REPOSITORY}" --remove-label run-e2e
