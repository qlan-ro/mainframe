# Manual run of the mock e2e suite for the changesets version PR. ci.yml does
# not run the suite on that PR (the branch is force-pushed after every merge
# to main); it fails the "e2e-mock / e2e-mock" check with a pointer here. When
# the PR is ready to merge, run this on branch changeset-release/main:
#   gh workflow run e2e-gate.yml --ref changeset-release/main
# or Actions → "e2e gate (manual)" → Run workflow → changeset-release/main.
# The job below calls the same reusable workflow. Its check run carries the
# same name, but the PR merge box only counts check runs from the PR's own CI
# run, not from a dispatched run — so once the suite is green here, the second
# job re-runs CI's failed e2e job on the same head; that job's require-manual
# step finds this run's success and passes, which is what turns the PR green.
# A later update to the branch needs a new run.
name: e2e gate (manual)

on:
  workflow_dispatch:

jobs:
  e2e-mock:
    uses: ./.github/workflows/e2e-mock.yml
    with:
      mode: run

  refresh-pr-check:
    needs: e2e-mock
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run CI's e2e job on this head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${GITHUB_REF_NAME}&event=pull_request&per_page=20" \
            --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\") | .id" | head -1)
          if [ -z "$run_id" ]; then
            echo "No CI run found for ${GITHUB_SHA}; nothing to refresh."
            exit 0
          fi
          echo "Re-running failed jobs of CI run ${run_id} (head ${GITHUB_SHA})"
          gh run rerun "$run_id" --failed --repo "${GITHUB_REPOSITORY}" || echo "No failed jobs to re-run."
