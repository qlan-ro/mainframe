# Runs the app-tauri Playwright e2e suite in MOCK mode (E2E_MODE=mock): AI-coupled specs
# replay recorded NDJSON fixtures via the native Rust mock adapter, un-mockable specs auto-skip, and
# non-AI specs run for real. Mock mode makes NO Claude/Codex API calls, so this needs no secrets.
#
# The suite drives the built @qlan-ro/mainframe-ui bundle in headless Chromium against the
# Rust daemon (browser-mode harness, fixtures/app-tauri.ts) — no Electron or xvfb.
name: e2e-mock

# TEMPORARILY DISABLED from automatic PR/push runs (2026-07-06): the suite is too slow to gate
# PRs right now (~30 min serial; workers:1 because the app is stateful on one daemon port).
# Re-enable by uncommenting the pull_request / push triggers once the suite is parallelized
# (multi-worker + per-worker daemon ports).
#
# It IS wired into the Release pipeline: release.yml calls this workflow (workflow_call) on every
# tag push and auto-publishes the draft release when this suite finishes green. Still runnable on
# demand via workflow_dispatch.
on:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]
  workflow_dispatch: # ad-hoc run on any ref (reports as "e2e-mock", not the gate name)
  # Invoked by release.yml (auto-publish gate) and ci.yml (every PR; the
  # suite runs when a PR gets the `run-e2e` label). `mode` exists for ci.yml: a
  # caller job skipped by its own `if:` reports a check named after the caller
  # ("e2e-mock"), while a job that runs reports the callee's name
  # ("e2e-mock / e2e-mock"). Deciding INSIDE this workflow keeps one name in
  # every case, which is what main's required check matches on:
  #   run            — the suite runs (default; release.yml, and ci.yml on `run-e2e`)
  #   skip           — the job is skipped, which satisfies the required check
  #                    (feature PRs)
  #   require-manual — the job fails at once with a pointer to the `run-e2e`
  #                    label, so the PR cannot merge until someone runs the
  #                    suite on its current head (the changesets version PR)
  workflow_call:
    inputs:
      mode:
        description: run | skip | require-manual
        type: string
        default: run
        required: false

# One run per ref; cancel superseded runs so PR pushes don't pile up jobs.
concurrency:
  group: e2e-mock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-mock:
    if: ${{ inputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      # The changesets version PR is force-pushed after every merge to main,
      # so ci.yml passes `require-manual` there instead of running the suite
      # on every update. This step passes when the suite already succeeded on
      # this exact head (a `run-e2e` run, then CI re-ran for another label or
      # a re-run) and otherwise fails with a pointer to the label. A satisfied
      # check sets `satisfied`, and every later step checks it: a step's
      # `exit 0` does not end the job, so without the guard the job would go
      # on to rebuild everything and run the whole suite again.
      - name: Require a manual run on the version PR
        id: manual
        if: ${{ inputs.mode == 'require-manual' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          prior=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=e2e-mock%20%2F%20e2e-mock&status=completed&per_page=50" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "${prior:-0}" -gt 0 ]; then
            echo "e2e suite already green on ${HEAD_SHA} (${prior} successful run(s)); nothing to do."
            echo "satisfied=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::The e2e suite has not run on this head. Add the run-e2e label to this PR to run it (gh pr edit <number> --add-label run-e2e). A later push to the branch needs the label again."
          exit 1

      - if: ${{ steps.manual.outputs.satisfied != 'true' }}
        uses: actions/checkout@v7

      # This job builds the daemon (build:app:tauri), which links libdbus via
      # keyring's secret-service backend — without the dev package cargo dies
      # in libdbus-sys' build.rs.
      - name: System dependencies
        if: ${{ steps.manual.outputs.satisfied != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - if: ${{ steps.manual.outputs.satisfied != 'true' }}
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - if: ${{ steps.manual.outputs.satisfied != 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - if: ${{ steps.manual.outputs.satisfied != 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - if: ${{ steps.manual.outputs.satisfied != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core-rs

      - if: ${{ steps.manual.outputs.satisfied != 'true' }}
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # build:app:tauri builds types + the Rust daemon and bakes the UI
      # bundle for the e2e daemon port (31416, NOT prod 31415 — assertBundleTargetsTestPort
      # aborts otherwise).
      - if: ${{ steps.manual.outputs.satisfied != 'true' }}
        run: pnpm --filter @qlan-ro/mainframe-e2e build:app:tauri
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - if: ${{ steps.manual.outputs.satisfied != 'true' }}
        run: pnpm --filter @qlan-ro/mainframe-e2e exec playwright install --with-deps chromium

      # The harness and daemon run git operations (worktrees, status); the runner has no identity.
      - name: Configure git identity for the runner
        if: ${{ steps.manual.outputs.satisfied != 'true' }}
        run: |
          git config --global user.email "e2e@mainframe.test"
          git config --global user.name "Mainframe E2E"
          git config --global init.defaultBranch main

      # MF_E2E_SKIP_BUILD: the bundle was built (and port-verified) above — each describe block
      # would otherwise rebuild it in beforeAll. MF_E2E_GLOBAL_TIMEOUT: the whole suite shares
      # one process budget (default 40 min starves the tail when every spec runs back-to-back).
      - if: ${{ steps.manual.outputs.satisfied != 'true' }}
        run: E2E_MODE=mock MF_E2E_SKIP_BUILD=1 MF_E2E_GLOBAL_TIMEOUT=5400000 pnpm --filter @qlan-ro/mainframe-e2e exec playwright test --project=tauri

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
