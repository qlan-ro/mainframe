# Temporary: proves the single-release-object change end to end against a
# throwaway draft, so the next real tag is not the first test. Deleted before
# the PR merges.
name: Release rehearsal

on:
  push:
    branches: [fix/release-single-object]

jobs:
  rehearse:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: v0.0.0-rehearsal
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app-tauri/src-tauri
            packages/core-rs

      - name: Clean up any leftover rehearsal release
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][].id" | while read -r id; do
            [ -n "$id" ] && gh api --method DELETE "repos/$REPO/releases/$id" && echo "removed stale $id"
          done

      # The create-release step, verbatim from release.yml.
      - name: create-release
        id: release
        env:
          PRERELEASE: 'true'
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")]")
          count=$(jq 'length' <<<"$existing")
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases already carry $TAG." >&2
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            id=$(jq -r '.[0].id' <<<"$existing")
          else
            id=$(gh api --method POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f name="$TAG" \
              -F draft=true -F prerelease=true -F generate_release_notes=false \
              --jq '.id')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "release id $id"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter "@qlan-ro/mainframe-ui..." build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The claim under test: with releaseId set, the action uploads into that
      # release and creates no second one. Unsigned — signing is irrelevant here.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app-tauri
          releaseId: ${{ steps.release.outputs.id }}

      - name: Attach a daemon tarball by id (the release job's upload path)
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts && echo rehearsal > artifacts/mainframe-daemon-darwin-arm64.tar.gz
          shopt -s nullglob
          files=(artifacts/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No daemon tarballs were downloaded — nothing to attach." >&2
            exit 1
          fi
          for path in "${files[@]}"; do
            name=$(basename "$path")
            old=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" \
              --jq "[.[] | select(.name == \"$name\")][0].id // empty")
            if [ -n "$old" ]; then
              gh api --method DELETE "repos/$REPO/releases/assets/$old" >/dev/null
            fi
            gh api --method POST \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$path" >/dev/null
            echo "attached $name"
          done

      - name: Verdict
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          echo "releases carrying $TAG: $count"
          assets=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq '[.[].name]')
          echo "assets on $RELEASE_ID: $(jq -c . <<<"$assets")"
          fail=0
          [ "$count" -eq 1 ] || { echo "::error::expected exactly 1 release, got $count"; fail=1; }
          for want in latest.json mainframe-daemon-darwin-arm64.tar.gz; do
            jq -e --arg w "$want" 'index($w)' <<<"$assets" >/dev/null \
              || { echo "::error::missing $want"; fail=1; }
          done
          jq -e 'map(select(endswith(".dmg"))) | length > 0' <<<"$assets" >/dev/null \
            || { echo "::error::no dmg uploaded"; fail=1; }
          exit $fail

      - name: Remove the rehearsal release
        if: always()
        run: |
          gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][].id" | while read -r id; do
            [ -n "$id" ] && gh api --method DELETE "repos/$REPO/releases/$id" && echo "cleaned $id"
          done
