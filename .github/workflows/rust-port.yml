# .github/workflows/rust-port.yml
name: Rust port (core-rs)

on:
  pull_request:
    paths:
      - 'packages/core-rs/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core-rs

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `keyring`'s secret-service backend links libdbus, so without the dev
      # package every cargo step below dies in libdbus-sys' build.rs before
      # anything compiles.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' packages/core-rs/rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core-rs

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Forbidden-pattern gate
        run: tools/verify-gate.sh
