name: Version Packages

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # This job only runs `changeset version`; it never builds native code.
      # Skip lifecycle scripts so node-pty/better-sqlite3 (no Linux prebuild)
      # don't need a native toolchain here.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GH_PAT, not GITHUB_TOKEN: a PR pushed and opened with the workflow token
      # is authored by github-actions[bot], and GitHub does not run `pull_request`
      # workflows for events the workflow token creates — the version PR's CI runs
      # ended `action_required`/startup-failure with zero jobs, so its required
      # checks never reported and every merge needed an admin bypass. With a PAT
      # the PR is authored by the token owner and CI (incl. the e2e gate) runs.
      - name: Create or update version PR
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
