<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mainframe window prototype v2</title>
<style>
:root{
  --claude:#d97757;--codex:#19c37d;
  --page:#d6d6da;--ground:#f5f5f8;--side:#ffffff;--chip:#ececef;--sheet:#ffffff;--card:#ffffff;--frame:#f2f2f4;--frame-edge:#e6e6e9;
  --hair:#e5e5e5;--hair2:#cfcfd4;--sel:#ececef;--hover:#ededf0;--press:#e2e2e6;
  --ink:#1f1f1f;--ink2:#48484a;--meta:#5c5c61;--faint:#a1a1a6;
  --accent:#0a84ff;--focus:#0b6fdc;--accent-ink:#0063cc;--accent-fill:#0063cc;--halo:rgba(10,132,255,.28);
  --live:#0b6fdc;
  --warn:#8a4b00;--warn-bg:rgba(217,119,6,.13);--warn-bd:rgba(138,75,0,.35);--warn-dot:#b45f06;
  --crit:#c70016;--crit-bg:rgba(199,0,22,.07);--crit-bd:rgba(199,0,22,.28);
  --ok:#1d7a46;--red:#c0392b;
  --fail:#b04466;/* failed work: a muted rose, quieter than --crit (Doru, 2026-11-24); 5.4:1 on white, 4.6:1 on hover */
  --bubble:#f1f1f3;--q:#f5f5f7;--track:#dcdcdf;--code:rgba(0,0,0,.06);
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 3px 10px rgba(0,0,0,.05);
  --shadow-menu:0 2px 4px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.16);
  --win-shadow:0 0 0 1px rgba(0,0,0,.14),0 22px 56px rgba(0,0,0,.2);
  --tipbg:#1f1f1f;--tipink:#fff;--sb:rgba(0,0,0,.22);--sel-bg:rgba(10,132,255,.26);
  color-scheme:light;
}
:root[data-theme=dark]{
  --page:#0b0b0b;--ground:#262626;--side:#171717;--chip:#363636;--sheet:#171717;--card:#262626;--frame:#1f1f1f;--frame-edge:#2e2e2e;
  --hair:#333336;--hair2:#454549;--sel:#2f2f31;--hover:#262628;--press:#303033;
  --ink:#ececec;--ink2:#c7c7cc;--meta:#aeaeb4;--faint:#5f5f64;
  --accent:#0a84ff;--focus:#3d9bff;--accent-ink:#5aaeff;--accent-fill:#0a6fd6;--halo:rgba(10,132,255,.36);
  --live:#0a84ff;
  --warn:#f0b35a;--warn-bg:rgba(240,179,90,.12);--warn-bd:rgba(240,179,90,.38);--warn-dot:#e08a1e;
  --crit:#ff8080;--crit-bg:rgba(255,107,107,.1);--crit-bd:rgba(255,107,107,.36);
  --ok:#4cc38a;--red:#ff7b6e;
  --fail:#e48aa3;
  --bubble:#262626;--q:#2d2d30;--track:#3b3b3f;--code:rgba(255,255,255,.09);
  --shadow-card:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25);
  --shadow-menu:0 2px 4px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.5);
  --win-shadow:0 0 0 1px rgba(255,255,255,.08),0 22px 56px rgba(0,0,0,.6);
  --tipbg:#ececec;--tipink:#1f1f1f;--sb:rgba(255,255,255,.22);--sel-bg:rgba(10,132,255,.42);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
/* Scrollbars (S3): overlay thumbs only, never a track or a gutter. Native scrollbars are hidden in every
   engine, because WKWebView with "always show scroll bars" (a Mac with a mouse) draws its grey track and
   takes 15 px whatever scrollbar-color says. A thin thumb (.osb, drawn by script) fades in while the area
   scrolls or is hovered, as macOS overlay scrollbars and Radix ScrollArea do. */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.osb{position:fixed;z-index:95;border-radius:3px;background:color-mix(in srgb,var(--ink) 26%,transparent);opacity:0;pointer-events:none;transition:opacity .25s,background .12s,width .12s,height .12s}
.osb.on{opacity:1;pointer-events:auto}
.osb:hover,.osb.drag{background:color-mix(in srgb,var(--ink) 42%,transparent)}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;padding:0}
button:disabled{cursor:default}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em}
::selection{background:var(--sel-bg);color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#thread:focus-visible{outline-offset:-2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic *{vector-effect:non-scaling-stroke}
.ic.sm{width:12px;height:12px}
.ic.fill{fill:currentColor}
.ic.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--meta);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn[aria-pressed=true]{background:var(--sel);color:var(--ink)}

/* page + window */
.stage{height:100vh;display:grid;place-items:center}
.win{width:min(var(--ww,1440px),100vw);height:100vh;display:flex;flex-direction:column;background:var(--ground);position:relative;overflow:hidden}
.shell{flex:1;min-height:0;display:flex}
.win.framed{height:calc(100vh - 24px);border-radius:12px;box-shadow:var(--win-shadow)}

/* icon rail (own column, hairline) */


/* title bar (today's shell) */
.titlebar{height:48px;flex:none;display:flex;align-items:center;background:var(--ground);padding-right:12px;min-width:0}
.lights{display:flex;gap:8px;width:80px;padding-left:20px;flex:none;align-items:center}
.lights i{width:12px;height:12px;border-radius:50%}
.capsule{width:224px;height:28px;flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:10px;background:var(--chip);font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.capsule:hover{background:var(--press)}
.capsule .sepd{width:3px;height:3px;border-radius:50%;background:var(--meta);flex:none}
.capsule .cbar{width:32px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 16%,transparent);overflow:hidden;flex:none}
.capsule .cbar i{display:block;height:100%;background:color-mix(in srgb,var(--ink) 62%,transparent)}
.capsule b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.capsule .m{color:var(--meta)}
.capsule .r{margin-left:auto;color:var(--meta);font-variant-numeric:tabular-nums}
.tabs{flex:1;min-width:0;display:flex;align-items:center;gap:4px;margin-left:8px}
/* Title bar segments (W1): [lights + usage] | [session tabs] | [workspace tabs + global actions].
   Each separator sits exactly above the column edge below it. */
.tl{display:flex;align-items:center;flex:none;height:100%;padding-right:12px}
.win.sideopen .tl{width:315px;padding-right:0}
.tsep{width:1px;height:16px;flex:none;background:var(--hair2)}
.tm{flex:1;min-width:0;display:flex;align-items:center;height:100%}
#wsep,#wsep2{opacity:0;transition:opacity .2s}
.win.ws #wsep,.win.ws #wsep2{opacity:1}
/* W1: a third separator closes the workspace segment, before Search and the view switch. */
#wsep2{width:0;margin:0}
.win.ws #wsep2{width:1px;margin:0 8px}
.tw{flex:none;width:0;height:100%;display:flex;align-items:center;overflow:hidden;transition:width .32s cubic-bezier(.22,1,.36,1)}
.win.ws .tw{width:max(0px,calc(var(--wsw) - var(--twr,148px)))}
.wtabs{flex:0 1 auto;overflow-x:auto;scrollbar-width:none}
.wtabs.ofl{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.wtabs .tab{flex:0 1 auto;max-width:176px;min-width:60px;padding:0 4px 0 10px;gap:6px}
.wtabs .tab[aria-selected=true]{flex-shrink:0}
/* Unselected tabs reserve no room for close: it overlays the title's end on hover, so truncated
   titles keep their characters. */
.wtabs .tab:not([aria-selected=true]){position:relative;padding-right:10px}
.wtabs .tab:not([aria-selected=true]) .x{position:absolute;right:4px;top:4px;display:none;background:var(--hover);box-shadow:-10px 0 8px -2px var(--hover)}
.wtabs .tab:not([aria-selected=true]):hover .x,.wtabs .tab:not([aria-selected=true]):focus-within .x{display:grid}
.tab .tg{color:var(--meta)}
.tab[aria-selected=true] .tg{color:var(--ink)}
.tw .wadd{width:28px;height:28px;margin-left:6px}
#wfiles{width:28px;height:28px;margin:0 12px 0 auto}
.tab{display:flex;align-items:center;gap:8px;height:32px;flex:0 1 180px;min-width:96px;padding:0 4px 0 12px;border-radius:9px;font-size:12.5px;color:var(--ink2)}
.tab:hover{background:var(--hover)}
.tab[aria-selected=true]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.05)}
.tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--meta);flex:none}
.tab .x:hover{background:var(--press);color:var(--ink)}
.tdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.tdot.run{background:var(--live)}
.tdot.need{background:none;border:1.5px solid var(--warn)}
.tact{display:flex;align-items:center;gap:12px;flex:none}
.ib32{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--meta);flex:none}
.ib32:hover{background:var(--hover);color:var(--ink)}
.ib32[aria-pressed=true]{background:var(--chip);color:var(--ink)}
.segsw{display:flex;gap:2px}
.segsw button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--meta)}
.segsw button:hover{background:var(--hover);color:var(--ink)}
.segsw button[aria-pressed=true]{background:var(--chip);color:var(--ink)}
/* rail */
.rail{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;background:var(--ground);border-right:1px solid var(--hair);position:relative}
/* Round only the junction to preserve the prototype’s existing paint outside it. */
.rail::after{content:"";position:absolute;left:100%;top:0;width:10px;height:10px;z-index:1;pointer-events:none;background:radial-gradient(circle at bottom right,transparent 8.5px,var(--hair) 9px 9.5px,var(--ground) 10px)}
.rb{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--meta);position:relative}
.rb .ic{width:20px;height:20px}
.rb:hover{background:var(--hover);color:var(--ink)}
.rb[aria-pressed=true]{background:var(--chip);color:var(--ink)}
.rail .grow{flex:1}
.rb .sdot{position:absolute;right:7px;bottom:7px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--ground)}
/* sidebar header */
.shd0{display:flex;align-items:center;height:44px;padding:0 6px 0 12px;flex:none}
.shd0 h2{flex:1;font-size:15px;font-weight:600;color:var(--ink)}
.sq{padding:0 12px 6px}
.sq input{width:100%;height:30px;border-radius:8px;border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;padding:0 10px;caret-color:var(--accent)}
.sq input::placeholder{color:var(--meta);opacity:1}
.newrow{display:flex;align-items:center;gap:10px;height:32px;margin:2px 8px 0;padding:0 6px 0 8px;border-radius:8px;font-size:13px;color:var(--ink);width:calc(100% - 16px)}
.newrow:hover{background:var(--hover)}
.newrow .ic{color:var(--ink2)}.newrow span{flex:1}
.scope{display:flex;align-items:center;gap:2px;margin:8px 8px 4px;flex:none}
.scopeb{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:4px 8px;border-radius:8px}
.scopeb:hover,.scopeb.open{background:var(--hover)}
.avs{display:flex;flex:none}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;box-shadow:0 0 0 2px var(--side);margin-left:-8px}
.av:first-child{margin-left:0}
.scopeb .tx{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.scopeb .tx span:first-child{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scopeb .tx span:last-child{font-size:11.5px;color:var(--meta)}

/* sidebar */
.side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--hair);border-top:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.slist{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px}
/* Session list rhythm (L4, picked in Live mode): groups breathe, rows tighten, group actions wait for hover. */
.gh{position:sticky;top:0;z-index:2;display:flex;align-items:flex-end;gap:2px;height:24px;margin-top:14px;padding:0 2px 4px 8px;background:var(--side);font-size:12px;font-weight:500;color:var(--meta)}
.gh:first-child{margin-top:4px}
.gh>span:first-child{flex:1}
.gh .iconbtn{width:22px;height:22px;opacity:0;transition:opacity .12s}
.gh:hover .iconbtn,.gh:focus-within .iconbtn,.gh .iconbtn[aria-expanded=true],.gh .iconbtn.on{opacity:1}
.gh .iconbtn.on{color:var(--accent-ink)}
.sr0{display:flex;align-items:center;gap:8px;width:100%;height:28px;padding:0 8px 0 6px;border-radius:8px;color:var(--ink2);font-size:13px}
.sr0:hover{background:var(--hover)}
.sr0[aria-current=true]{background:var(--sel);color:var(--ink)}
.sr0 .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr0 .v{flex:none;font-size:12px;color:var(--meta);font-variant-numeric:tabular-nums}
.sr0 .v.need{color:var(--warn);font-weight:500}
.sr0 .vst{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;min-width:16px}.sr0 .vst .ic{color:var(--live)}
.st{width:16px;height:16px;flex:none;display:grid;place-items:center}
.lav{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:9.5px;line-height:1;font-weight:600;color:var(--meta);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.sr0[aria-current=true] .lav{color:var(--ink);background:color-mix(in srgb,var(--ink) 12%,transparent)}
.st .runic{color:var(--live)}
.st .needic{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--warn)}
.sempty{padding:8px;font-size:12px;color:var(--meta)}

/* sheet, header */
.sheet{flex:1;min-width:0;display:flex;background:var(--sheet);border-top:1px solid var(--hair);position:relative}
/* Session panel floating over a chat column too narrow to dock it (R11), as in the app. */
.spanel.float{position:absolute;top:52px;right:8px;margin:0;z-index:25;box-shadow:var(--shadow-menu);max-height:calc(100% - 52px - var(--pbot,8px))}
.pscrim{position:absolute;inset:44px 0 calc(var(--pbot,8px) - 8px) 0;z-index:24;background:color-mix(in srgb,var(--sheet) 40%,transparent)}
.workcol{flex:1;min-width:0;display:flex;flex-direction:column}
.head{display:flex;gap:12px;align-items:center;padding:0 12px 0 16px;height:44px;flex:none;font-weight:600;min-width:0}
.head h1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.head .grow{flex:1}
.pd{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.body{flex:1;min-height:0;display:flex}
.colwrap{flex:1;min-width:0;min-height:0;display:flex}
/* The transcript scrolls across the whole main pane so its scrollbar sits at the pane's right edge;
   the reading column stays centred at --cw through padding. */
.col{width:100%;display:flex;flex-direction:column;min-height:0}

/* transcript */
.thread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:8px max(24px,calc((100% - var(--cw,740px)) / 2)) 16px;font-size:14px;line-height:22px}
.inner{margin-top:auto;display:flex;flex-direction:column;gap:16px}
.msg.u{display:flex;justify-content:flex-end}
.bubble{max-width:85%;background:var(--bubble);border-radius:14px;padding:8px 14px;font-size:14px;line-height:22px;overflow-wrap:anywhere}
.bchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bchips span{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--ink2);background:var(--code);border-radius:6px;padding:0 7px}
/* Message footer (T1b): time and actions appear together on hover or keyboard focus; the row keeps its
   height so nothing moves. Times are otherwise shown only as markers at the start and after a gap. */
.steered{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-size:12px;color:var(--meta);margin-top:4px}
.mfoot{display:flex;align-items:center;gap:2px;height:24px;margin-top:4px;opacity:0;transition:opacity .12s}
.mfoot.u{justify-content:flex-end}
.turn:hover>.mfoot,.turn:focus-within>.mfoot,.mwrap:hover>.mfoot,.mwrap:focus-within>.mfoot,.mfoot.show{opacity:1}
.mtime{font-size:12px;color:var(--meta);font-variant-numeric:tabular-nums;padding:0 6px 0 2px}
.mfoot.u .mtime{padding:0 2px 0 6px}
.mab{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--meta)}
.mab:hover{background:var(--hover);color:var(--ink)}
.mab .ic{width:14px;height:14px}
.tmark{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--meta);font-variant-numeric:tabular-nums;margin:4px 0 -4px}
.turn{display:flex;flex-direction:column}
.wk{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:28px;border-radius:7px;padding:0 4px;color:var(--ink2);font-size:13px}
.wkt{position:absolute;inset:0;border-radius:7px}
.wkt:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.wk>*:not(.wkt){position:relative;pointer-events:none}
.wk>.fl,.wk>.ag{pointer-events:auto}
.wk:hover{background:var(--hover)}
.wk .ok{color:var(--ok);width:16px;height:16px;flex:none;display:grid;place-items:center}
.wk b{font-weight:500;color:var(--ink)}
.wk .mt{color:var(--meta);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .fl{color:var(--fail);font-size:12px;font-weight:400;flex:none;height:24px;padding:0 6px;margin-right:-2px;border-radius:6px}
.wk .fl:hover{background:color-mix(in srgb,var(--fail) 10%,transparent)}
.wk .fl.retried{color:var(--meta);font-weight:400}
.wk .fl.retried:hover{background:var(--press);color:var(--ink)}
.wk .bad{color:var(--fail)}.wk .stp{color:var(--meta)}
/* T1c: the turn names its agents; while one is still going the count carries its live status, needs-you first. */
.wk .ag{color:var(--meta);font-size:12px;flex:none;height:24px;padding:0 6px;margin-right:-2px;border-radius:6px;white-space:nowrap}
.wk .ag:hover{background:var(--press);color:var(--ink)}
.wk .ag .nd{color:var(--warn)}
.wk .ok .spin{width:13px;height:13px}
.wk .chv{color:var(--meta);transition:transform .15s}
.wk.open .chv{transform:rotate(90deg)}
.wrows{display:none;flex-direction:column;padding:2px 0 4px 22px}
.wk.open+.wrows{display:flex}
.tr{display:flex;align-items:center;gap:8px;min-height:26px;font-size:13px;color:var(--ink2);min-width:0}
.tr .ic{color:var(--meta);width:14px;height:14px}
.tr .tg{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tr .mt{margin-left:auto;font-size:12px;color:var(--meta);white-space:nowrap;padding-left:8px;flex:none}
.tr.bad .mt{color:var(--fail)}
.tr.bad .ic{color:var(--fail)}
.ans{margin-top:6px}
.ans p{margin:8px 0}
.ans ul,.ans ol{margin:8px 0;padding-left:22px}
.ans li{margin-top:4px}
.ans code,.bubble code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em}
.ans table{border-collapse:collapse;margin:8px 0;font-size:13px;line-height:20px}
.ans th{font-weight:500;color:var(--meta);text-align:left;padding:3px 24px 3px 0;border-bottom:1px solid var(--hair)}
.ans td{padding:3px 24px 3px 0}
.ans td.n,.ans th.n{font-variant-numeric:tabular-nums}
.cb{margin:8px 0;border-radius:8px;background:var(--code);padding:8px 12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;line-height:19px;white-space:pre;overflow-x:auto}
.cb small{display:block;font-family:inherit;font-size:11.5px;color:var(--meta);margin-bottom:2px}
.live{color:var(--meta);font-size:13px;display:flex;gap:8px;align-items:center;padding:0 4px}
.live .runic{color:var(--live)}
.live code{background:var(--code);padding:1px 5px;border-radius:5px}
.div{display:flex;align-items:center;gap:10px;color:var(--meta);font-size:12px}
.div:before,.div:after{content:"";flex:1;height:1px;background:var(--hair)}
.div span{display:inline-flex;gap:6px;align-items:center;text-align:center}
.empty{color:var(--meta);font-size:14px;text-align:center;padding:0 12px 40px}
/* K11: the new-session empty state. It sits where the conversation will start, just above the composer, so nothing
   jumps when the first message goes. Project first, where it runs, then the project's own recent sessions and open
   tasks: real things to resume or start from, never generic prompt suggestions. */
.nse{display:flex;flex-direction:column;gap:22px;padding:0 4px 12px}
.nsh{display:flex;align-items:center;gap:12px}
.nsav{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--ink2);background:color-mix(in srgb,var(--ink) 7%,transparent);box-shadow:inset 0 0 0 1px var(--hair)}
.nsh h2{margin:0;font-size:19px;line-height:26px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.nsh p{margin:0;font-size:13px;line-height:18px;color:var(--meta)}
.nsh p code{font:12px/18px ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink2)}
.nsg{display:flex;flex-direction:column}
.nsl{font-size:12px;line-height:16px;font-weight:500;color:var(--meta);padding:0 8px 6px}
.nsr{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;text-align:left;color:var(--ink2);font-size:13.5px;min-width:0}
.nsr:hover{background:var(--hover);color:var(--ink)}
.nsr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.nsr>.ic{color:var(--meta);flex:none}
.nsr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nsr .v{flex:none;font-size:12px;color:var(--meta);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.nsr .v.need{color:var(--warn)}
.nsr .go{flex:none;color:var(--meta);opacity:0;transition:opacity .12s}
.nsr:hover .go,.nsr:focus-visible .go{opacity:1}
.nshint{margin:0;font-size:13px;color:var(--meta);padding:0 8px}

/* composer frame */
.composer{container-type:inline-size;flex:none;padding:0 0 16px;width:min(var(--cw,740px),calc(100% - 48px));margin:0 auto}
.frame{display:flex;flex-direction:column}
/* Strips are narrower than the card and tuck under its edge, so they read as part of it rather than a box around it. */
.frame{--drawer-inset:12px;--tuck:17px}
/* Top drawer (T3's attached banner): same surface and outline as the card, inset 12 px each side,
   rounded on top only, its bottom tucked 17 px under the card so the seam disappears. */
.top{position:relative;z-index:0;margin:0 var(--drawer-inset) calc(-1 * var(--tuck));padding:4px 4px calc(var(--tuck) + 4px);
  border-radius:12px 12px 0 0;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair),var(--shadow-card)}
.top.warn{background:color-mix(in srgb,var(--warn) 8%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 28%,transparent),var(--shadow-card)}
.top:not(:has(> :not([hidden]))){display:none}
.card{z-index:1}
/* Bottom context row (T3's ContextStrip): no box of its own, a bare row of quiet controls under the card. */
.bstrip .chg{margin-left:auto}
.top{display:flex;align-items:center;min-height:32px;min-width:0}
.ctxrow{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.cbtn2{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:8px;color:var(--ink2);font-size:13px;min-width:0;white-space:nowrap}
.cbtn2:hover,.cbtn2.open{background:var(--hover)}
.cbtn2 .lab{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cbtn2 .ic{color:var(--meta)}
.cbtn2 b{font-weight:500;color:var(--ink)}
.cbtn2 em{font-style:normal;color:var(--meta)}
.acts{display:flex;flex-direction:column;flex:1;min-width:0;max-height:calc(28px * 6);overflow-y:auto}
/* Every ongoing item is its own row in the strip; no popover. Needs-you first, then running. */
.ar{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 2px 0 8px;border-radius:8px;font-size:12.5px;color:var(--ink2);min-width:0}
.ar>.ic{flex:none;color:var(--live)}
.ar .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.ar .v{flex:none;color:var(--meta);font-variant-numeric:tabular-nums}
.ar.need>.ic,.ar.need .v{color:var(--warn)}
.ar.need .v{font-weight:500}
.ar .ab{flex:none;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink2)}
.ar .ab:hover{background:var(--hover);color:var(--ink)}
.ar.need .ab{color:var(--accent-ink)}
.ar.cfm{background:var(--hover)}
.ar.cfm .t{color:var(--ink)}
.ar .ab.danger{color:var(--red)}
.ar .ab.danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.ar .more{flex:none;font-size:12px;color:var(--meta);font-variant-numeric:tabular-nums}
.ar .tg,.ar .tgsp{flex:none;width:24px;height:24px}
.ar .tg{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--meta)}
.ar .tg:hover{background:var(--hover);color:var(--ink)}
.ar .tg .ic.up{transform:rotate(180deg)}
.ar.sum{gap:6px}.ar.sum .v.need{color:var(--warn);font-weight:500}.ar.sum .t{flex:1;color:var(--meta)}.ar.sum .v.vst{display:inline-flex;align-items:center;gap:4px}.ar.sum .v.vst .ic{width:12px;height:12px;color:var(--live)}
.card{position:relative;background:var(--card);border-radius:16px;padding:10px 10px 8px;box-shadow:inset 0 0 0 1px var(--hair),var(--shadow-card);transition:box-shadow .16s}
.card:has(.field:focus){box-shadow:inset 0 0 0 2px var(--focus),0 0 0 3px var(--halo),var(--shadow-card)}
.queue{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.q{display:flex;gap:8px;align-items:center;padding:2px 2px 2px 10px;min-height:32px;border-radius:8px;background:var(--q);font-size:13px;animation:rise .22s cubic-bezier(.16,1,.3,1)}
.q.bad{background:color-mix(in srgb,var(--fail) 7%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fail) 28%,transparent);padding-left:8px}
.q.bad>.ic{color:var(--fail)}
.qbody{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;padding:3px 0}
.qm{font-size:12px;font-weight:400;color:var(--fail)}
.q b{font-size:11.5px;font-weight:600;color:var(--meta);flex:none}
.q .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbody .qt{flex:none}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.tbtn{height:24px;padding:0 8px;border-radius:6px;font-weight:600;color:var(--accent-ink);flex:none}
.tbtn:hover{background:var(--hover)}
.atts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.att{position:relative;display:flex;align-items:center;gap:8px;height:40px;width:172px;box-sizing:border-box;padding:0 2px 0 8px;border-radius:9px;background:var(--q);flex:none}
.att>.ic{color:var(--meta)}
.att .an{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
/* Every tile is the same width; a longer name, note or selector fades at the edge and shows whole in the tooltip. */
.att .an>*{display:block;white-space:nowrap;overflow:hidden}
.att .an>.fade{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent)}
.att .an>:first-child{font-size:12.5px;font-weight:500}
.att .an>:last-child{font-size:11.5px;color:var(--meta)}
/* C14: what a draft carries. Tiles share one shape (40 px, 9 px radius, the queue's quiet fill): a file shows its
   extension, an image its thumbnail, a preview capture its thumbnail, selector and note. Quotes sit as segments
   above the text they belong to, each with its own prose, as the app's multi-quote composer does. */
.att .ext{width:28px;height:28px;border-radius:6px;flex:none;display:grid;place-items:center;font:600 9px/1 -apple-system,system-ui,sans-serif;letter-spacing:.02em;text-transform:uppercase;color:var(--xc,var(--meta));background:color-mix(in srgb,var(--xc,var(--meta)) 13%,transparent)}
.att .th{width:32px;height:32px;border-radius:6px;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px var(--hair);background:var(--sheet)}
.att .th svg{display:block;width:100%;height:100%}
.att.capt .aed{position:absolute;right:28px;top:8px;display:none;background:var(--q);box-shadow:-10px 0 8px -2px var(--q)}
.att.capt:hover .aed,.att.capt:focus-within .aed{display:grid}
.att.capt .addn{font-size:12.5px;color:var(--accent-ink);text-align:left;padding:0;font-weight:400}
.att.capt .addn:hover{text-decoration:underline}
.att.capt .an span:first-child{font-weight:400;color:var(--ink)}
.att.capt .an .sel{font:11px/1.3 ui-monospace,"SF Mono",Menlo,monospace;color:var(--meta)}
.att .aed{width:24px;height:24px}
.segs{display:flex;flex-direction:column;gap:8px;padding:2px 4px 8px}
.qseg{display:flex;flex-direction:column;gap:4px}
.qbk{position:relative;display:flex;align-items:flex-start;gap:8px;padding:2px 2px 2px 12px;color:var(--meta);font-size:13px;line-height:19px}
.qbk::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;border-radius:1px;background:var(--hair2)}
.qbk .qxw{flex:1;min-width:0}
.qbk .qx{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Highlight to quote (today's ChatSelectionToolbar): selecting text in a message offers Quote and New session. */
.seltb{position:fixed;z-index:60;display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--card);box-shadow:0 0 0 1px var(--hair),var(--shadow-menu);animation:pop .12s ease-out}
.seltb[hidden]{display:none}
.seltb button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;font-size:12.5px;color:var(--ink2)}
.seltb button:hover{background:var(--hover);color:var(--ink)}
.seltb .ic{width:14px;height:14px;color:var(--meta)}
.selhl{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:2px}
.qbk .qsrc{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.qbk .iconbtn{width:22px;height:22px;flex:none;margin-top:-1px}
.qprose{font-size:14px;line-height:21px;color:var(--ink);padding:0 0 0 0;white-space:pre-wrap}
.fieldwrap{padding:2px 4px 8px}
.field{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;line-height:21px;height:21px;padding:0;caret-color:var(--accent);overflow-y:hidden}
.field::placeholder{color:var(--meta);opacity:1}
.bar{display:flex;align-items:center;gap:2px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:8px;color:var(--ink2);font-size:13px;flex:none;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--hover)}
.btn.open{background:var(--press)}
.btn[aria-disabled=true]{cursor:default}
.btn[aria-disabled=true]:hover{background:none}
.plus{width:28px;padding:0;justify-content:center;border-radius:50%}
.model{flex:0 1 auto;min-width:0}
.model .ml{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model .ml i{font-style:normal;color:var(--meta);margin-left:4px}
.perm{font-weight:500;flex:0 1 auto;min-width:0}
.perm .plabel2{min-width:0;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--meta)}
.perm.warn{color:var(--warn)}.perm.warn .chev{color:var(--warn)}
.perm.chip{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-bd)}
.perm.plan{color:var(--accent-ink)}
.perm .then{font-weight:400;color:var(--meta)}
.combo{display:none;flex:0 1 auto;min-width:44px}
/* Only the model name truncates; the permission status never does (C6). */
.combo .ml{min-width:0;display:inline-flex;white-space:nowrap}
.combo .cm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.combo .cs,.combo .cp{flex:none}
.combo .cp.warn{color:var(--warn)}.combo .cp.plan{color:var(--accent-ink)}
.combo.chip{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-bd)}
.spacer{flex:1;min-width:0}
.model[aria-disabled=true] .chev{display:none}
.ring{gap:6px;padding:0 6px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--meta)}
.ring.warn{color:var(--warn)}.ring.crit{color:var(--crit)}
.ring svg{width:16px;height:16px;flex:none}
.ring .trk{stroke:color-mix(in srgb,var(--ink) 26%,transparent)} /* a visible full track: a gauge, not a spinner */
.ring .arc{stroke:currentColor;transition:stroke-dasharray .3s cubic-bezier(.16,1,.3,1)}
.send{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid var(--hair2);color:var(--faint);background:transparent;transition:background .15s,border-color .15s,color .15s}
.send.ready{background:var(--accent);border-color:var(--accent);color:#fff}
.send.ready:hover{filter:brightness(1.08)}
.send.stop{background:var(--ink);border-color:var(--ink);color:var(--card)}
.send.stop:hover{opacity:.86}
.send.stopping{color:var(--meta)}
.split{order:1;display:inline-flex;height:28px;border-radius:14px;background:var(--accent-fill);color:#fff;flex:none}
.split button{display:inline-flex;align-items:center;gap:6px;height:28px;color:#fff;font-weight:600;font-size:13px}
.split button:hover{background:rgba(255,255,255,.14)}
.sp-main{padding:0 8px 0 12px;border-radius:14px 0 0 14px}
.sp-chev{width:26px;justify-content:center;border-radius:0 14px 14px 0;box-shadow:inset 1px 0 0 rgba(255,255,255,.35)}
.sp-main:focus-visible,.sp-chev:focus-visible{outline-offset:-2px;outline-color:#fff}
.bstrip{display:flex;align-items:center;gap:2px;min-height:30px;padding:6px 6px 0;font-size:12.5px;color:var(--ink2);min-width:0}
.tbtn2{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 6px;border-radius:6px;min-width:0;color:var(--ink2);white-space:nowrap}
button.tbtn2:hover{background:var(--hover)}
.tbtn2.open{background:var(--press)}
.tbtn2 .ic{color:var(--meta)}
.tbtn2 .lab{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbtn2 em{font-style:normal;color:var(--meta)}
.tbtn2 b{font-weight:500}
.tbtn2[aria-disabled=true]{cursor:default}
.tbtn2.info{color:var(--ink2)}
.chg .add,.add{color:var(--ok)}.chg .del,.del{color:var(--red)}
.chg{font-variant-numeric:tabular-nums;font-weight:500}
.dotsep{color:var(--meta);padding:0 2px}
.t-short{display:none}

@container (max-width:559px){ .model{max-width:150px} }
@container (max-width:399px){
  .model,.perm{display:none}
  .combo{display:inline-flex}
  .t-long{display:none}.t-short{display:inline}
  .sp-main .qt{display:none}.sp-main{padding:0 6px 0 10px}
  .card{padding:8px 8px 6px}
}
@container (max-width:319px){ .combo .cm,.combo .cs,.combo .pd,.combo .chev{display:none}
  .bar.splitting{flex-wrap:wrap;row-gap:4px} .bar.splitting .spacer{flex-basis:100%;height:0} .bar.splitting .ring{margin-left:auto} .ring{padding:0 4px} .bar{gap:0} }

/* session panel */
.spanel{width:300px;flex:none;align-self:flex-start;max-height:calc(100% - 16px);margin:8px 8px 8px 0;border-radius:14px;border:1px solid var(--hair);background:var(--sheet);overflow-y:auto;display:flex;flex-direction:column} /* a real border: an inset shadow is painted under the sticky header and got covered */
:root[data-theme=dark] .spanel{background:color-mix(in srgb,var(--card) 55%,var(--sheet))}
.ph{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 6px 0 14px;flex:none;position:sticky;top:0;background:inherit;z-index:1}.ph .pt{font-size:13px;font-weight:600;color:var(--ink)}
.sec{position:relative;padding:0 0 10px} /* rhythm (R12): air between sections, labels tight to their rows */
.sec+.sec:before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--hair)}
.shd{display:flex;align-items:flex-end;gap:6px;height:22px;margin-top:12px;padding:0 14px 4px 16px;font-size:12px;font-weight:500;color:var(--meta)}
.shd .ac{margin-left:auto;font-size:12px;font-weight:500;color:var(--meta)}
button.shd:hover,.shd .ac:hover{color:var(--ink)}
.pr{display:flex;align-items:center;gap:8px;width:calc(100% - 12px);margin:0 6px;height:28px;padding:0 10px;border-radius:7px;color:var(--ink2);font-size:13px}
button.pr:hover{background:var(--hover)}
.pr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .t.b{font-weight:600;color:var(--ink)}
.pr .v{flex:none;font-size:12px;color:var(--meta);font-variant-numeric:tabular-nums}
.pr .v.need{color:var(--warn);font-weight:500}
.pr .v.bad{color:var(--fail);font-weight:400}
.pr>.ic{color:var(--meta)}
.pr .runic{color:var(--live)}
.pr .okic{color:var(--ok)}
.pr .needic2{color:var(--warn)}
.pr .stopsq{color:var(--crit)}
.pr .v .ic{color:var(--meta)}.pr .v .stopsq .ic{color:var(--crit)}
.tiles{display:flex;gap:8px;padding:2px 16px 4px;flex-wrap:nowrap;overflow:hidden}
.tiles.all{flex-wrap:wrap}
.tile{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--q);box-shadow:inset 0 0 0 1px var(--hair);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;font-weight:600;color:var(--ink2)}
button.tile:hover{background:var(--hover)}
.tile.more{font-family:inherit;font-size:12px;font-weight:500;color:var(--ink)}

/* menu + tooltip + toast */
.msearch{display:flex;align-items:center;gap:6px;margin:2px 2px 4px;padding:0 8px;height:30px;border-radius:7px;background:var(--chip);color:var(--meta)}
.msearch input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;outline:0}
.msearch:focus-within{box-shadow:0 0 0 2px var(--focus)}
.menu{position:fixed;z-index:50;background:var(--card);border-radius:10px;box-shadow:0 0 0 1px var(--hair),var(--shadow-menu);padding:4px;max-height:calc(100vh - 16px);overflow-y:auto;animation:pop .14s cubic-bezier(.16,1,.3,1);outline:0}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.mi{display:flex;align-items:flex-start;gap:10px;width:100%;padding:7px 10px;border-radius:6px;min-height:28px}
.mi:focus,.mi:hover{background:var(--hover);outline:0}
.mi:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
.mi[aria-disabled=true]{opacity:.55;cursor:default}
.mi[aria-disabled=true]:hover{background:none}
.mi-lead{width:16px;height:20px;display:grid;place-items:center;flex:none;color:var(--meta)}
.mi-lead .runic{color:var(--live)}.mi-lead .needic2{color:var(--warn)}
.mi-body{flex:1;min-width:0;display:flex;flex-direction:column}
.mi-l{font-weight:500;line-height:20px;overflow-wrap:anywhere}
.mi-d{font-size:12px;line-height:1.35;color:var(--meta)}
.mi-d.need{color:var(--warn);font-weight:500}
.mi-t{flex:none;display:grid;place-items:center;height:20px;min-width:16px;color:var(--ink2);font-size:12px}
.mi-t kbd{font:inherit;font-size:11.5px;color:var(--meta);background:var(--code);border-radius:4px;padding:0 5px}
.mi-t .actw{font-weight:600;color:var(--accent-ink)}
.mi.warn .mi-l{color:var(--warn)}
.mi.mono .mi-l{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;font-weight:400}
.mlabel{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--meta);padding:8px 10px 3px}
.mlabel .ic{width:14px;height:14px}
.msep{height:1px;background:var(--hair);margin:4px 6px}
.mnote{font-size:12px;color:var(--meta);padding:6px 10px;line-height:1.4}
.mtext{padding:8px 10px 4px;font-size:13px;font-weight:500;color:var(--ink)}
.mtext.hint{padding:6px 10px 4px;font-size:12px;font-weight:400;color:var(--meta)}
.minfo{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:8px 10px 6px;font-size:12px}
.minfo span{color:var(--meta)}.minfo code{overflow-wrap:anywhere;color:var(--ink)}
.minfo h3{grid-column:1/-1;font-size:12px;font-weight:600;margin-bottom:2px}
.mrow{display:flex;gap:2px;padding:2px 4px 4px}
.mrow .mi{flex:1;justify-content:center;padding:4px 6px;min-height:28px;border-radius:7px}
.mrow .mi[aria-checked=true]{background:var(--sel)}
.mrow .mi .mi-l{font-size:12.5px;white-space:nowrap}
/* C5: provider tabs at the top of the model menu, as in today's app: browsing a tab doesn't change the model. */
.mrow.mtabs{margin:4px 6px 6px;padding:2px;border-radius:9px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.mrow.mtabs .mi[aria-checked=true]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.mrow.mtabs .mi .pd{width:7px;height:7px;border-radius:50%;flex:none;margin-right:6px}
.confirm{position:fixed;z-index:55;width:300px;max-width:calc(100vw - 16px);background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--hair),var(--shadow-menu);padding:14px 14px 12px;animation:pop .14s cubic-bezier(.16,1,.3,1)}
.confirm h2{font-size:14px;font-weight:600;margin-bottom:4px}
.confirm p{color:var(--ink2);line-height:1.45}
.confirm .cr{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.cbtn{height:28px;padding:0 12px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--hair2);font-weight:500;text-align:center}
.cbtn:hover{background:var(--hover)}
.cbtn.pri{background:var(--accent-fill);color:#fff;box-shadow:none}
.cbtn.pri:hover{filter:brightness(1.1)}
.cbtn.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-bd)}
.cbtn.warn:hover{filter:brightness(.97)}
.tip::after{content:"";position:absolute;width:8px;height:8px;background:var(--tipbg);left:var(--tip-arrow-x,50%);transform:translateX(-50%) rotate(45deg);bottom:-4px}
.tip[data-side=below]::after{top:-4px;bottom:auto}
.tip{position:fixed;z-index:60;max-width:280px;background:var(--tipbg);color:var(--tipink);font-size:12px;line-height:1.4;padding:5px 9px;border-radius:7px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:40;background:var(--tipbg);color:var(--tipink);padding:7px 14px;border-radius:9px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:pop .18s cubic-bezier(.16,1,.3,1);max-width:80%}

/* prototype controls (floating, collapsible) */
.pc{position:fixed;left:72px;bottom:12px;z-index:80;width:224px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:var(--card);border-radius:10px;box-shadow:0 0 0 1px var(--hair2),var(--shadow-menu);font-size:12px;overflow:hidden}
.pc.collapsed{width:auto}
.pc.collapsed .pbody{display:none}
.pc .phead{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;min-height:30px;font-weight:600;color:var(--ink2)}
.pc .phead span{flex:1;white-space:nowrap}
.pbody{overflow-y:auto;padding:2px 8px 10px;border-top:1px solid var(--hair)}
.plabel{font-size:11.5px;font-weight:600;color:var(--meta);padding:10px 4px 4px;display:flex;justify-content:space-between}
.seg{display:flex;background:var(--ground);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;height:24px;border-radius:5px;text-align:center;color:var(--ink2)}
.seg button[aria-checked=true]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--hair)}
.pbtn{display:block;width:100%;min-height:24px;padding:3px 8px;border-radius:6px;color:var(--ink2)}
.pbtn:hover{background:var(--hover)}
.pbtn[aria-current=true]{background:var(--sel);color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);height:24px}
/* workspace panel (W4): slides in from the right, pushing the chat column */
.wsp{flex:none;width:0;position:relative;overflow:hidden;background:var(--sheet);border-top:1px solid var(--hair);transition:width .32s cubic-bezier(.22,1,.36,1)}
.win.ws .wsp{width:var(--wsw);border-left:1px solid var(--hair)}
.win.noanim .wsp,.win.noanim .tw,.win.noanim #wsep{transition:none}
.wsin{position:absolute;top:0;bottom:0;left:0;width:calc(var(--wsw) - 1px);display:flex}
.wsgrip{position:absolute;left:0;top:0;bottom:0;width:6px;z-index:3;cursor:col-resize}
.wsgrip:hover,.wsgrip.drag,.wsgrip:focus-visible{box-shadow:inset 2px 0 0 var(--focus);outline:none}
.wsmain{flex:1;min-width:0;display:flex;flex-direction:column}
.wbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.wsfiles{width:224px;flex:none;border-left:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.wsfiles .fh{display:flex;align-items:center;height:36px;padding:0 6px 0 12px;font-size:12px;font-weight:500;color:var(--meta);flex:none}
.wsfiles .fh span{flex:1}
.ftree{flex:1;overflow:auto;padding:0 6px 8px}
.fr{display:flex;align-items:center;gap:6px;width:100%;height:26px;border-radius:6px;padding-right:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.fr:hover{background:var(--hover)}
.fr[aria-current=true]{background:var(--sel);color:var(--ink)}
.fr .ic{color:var(--meta)}
.fr span{overflow:hidden;text-overflow:ellipsis}
/* tab bodies */
.addr{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px;flex:none;border-bottom:1px solid var(--hair)}
.addr .url{flex:1;min-width:0;height:28px;margin-left:4px;border-radius:8px;background:var(--chip);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.addr .url .ic{color:var(--meta)}
.addr .back .ic{transform:rotate(180deg)}
.pv{flex:1;background:var(--ground);padding:28px 24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.pv h3,.pv .pvh{font-size:15px;font-weight:600}
.pv p{font-size:12.5px;color:var(--meta);max-width:420px}
.pv .story{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--hair)}
.pv .story .capsule{cursor:default}
.pv .lab0{font-size:11.5px;color:var(--meta)}
.term{flex:1;font:12px/19px ui-monospace,"SF Mono",Menlo,monospace;padding:10px 14px;white-space:pre;color:var(--ink2)}
.term .ps{color:var(--ok)}.term .dim{color:var(--meta)}.term .okk{color:var(--ok)}
.term .cur{display:inline-block;width:7px;height:14px;vertical-align:-2px;background:var(--ink2)}
.code{font:12px/20px ui-monospace,"SF Mono",Menlo,monospace;padding:8px 0;display:grid;grid-template-columns:auto 1fr;align-content:start;white-space:pre;color:var(--ink)}
.code .ln{padding:0 14px 0 16px;text-align:right;color:var(--meta);user-select:none}
.code .lc{padding-right:16px}
.code .k{color:var(--accent-ink)}.code .s{color:var(--ok)}.code .c{color:var(--meta);font-style:italic}
.code .dl{grid-column:1/-1;display:grid;grid-template-columns:subgrid}
.code .dl.a{background:color-mix(in srgb,var(--ok) 15%,transparent)}
.code .dl.d{background:color-mix(in srgb,var(--red) 15%,transparent)}
.code .dl.h{color:var(--meta);background:var(--hover)}
.fileh{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;flex:none;font-size:12px;color:var(--meta);border-bottom:1px solid var(--hair)}
.fileh b{font-weight:500;color:var(--ink2)}
.fileh .add{color:var(--ok)}.fileh .del{color:var(--red)}
.wempty{flex:1;display:grid;place-items:center;padding:24px}
.wempty .box{width:min(300px,100%)}
.wempty h3{font-size:13px;font-weight:600;margin:0 0 8px 8px}
.wrow{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 8px;border-radius:8px;font-size:13px;color:var(--ink2)}
.wrow:hover{background:var(--hover);color:var(--ink)}
.wrow .ic{color:var(--meta)}
.wrow span{flex:1}
.wrow kbd,.wrow .h{font:11.5px ui-monospace,"SF Mono",Menlo,monospace;color:var(--meta)}
/* Gates (G1–G4): today's app cards (GateCard: PermissionGate, PlanGate, AskUserQuestionGate),
   pinned in the slot above the composer as ChatGateMount does, restyled only by the prototype tokens. */
.gate{max-height:45vh;overflow-y:auto;margin:0 -4px 8px;padding:4px;scrollbar-width:none}
.gc{border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);background:var(--card);overflow:hidden}
.gc.warn{border-color:color-mix(in srgb,var(--warn-dot) 45%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn-dot) 15%,transparent)}
.gh2{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.gtile{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent-ink)}
.gc.warn .gtile{background:var(--warn-bg);color:var(--warn)}
.gtile .ic{width:14px;height:14px}
.ghx{display:flex;flex-direction:column;min-width:0;flex:1}
.gey{font-size:12px;font-weight:500;color:var(--meta)}
.gti{font-size:14px;line-height:1.3;font-weight:600;color:var(--ink)}
.gbadge{flex:none;font:500 11.5px ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink2);border:1px solid var(--hair2);border-radius:6px;padding:1px 6px}
.gin{padding:0 16px 8px 50px}
.gtool{display:flex;align-items:center;gap:8px;font:600 13px ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink)}
.gtool .ic{width:14px;height:14px;color:var(--meta)}
.gcmd{margin-top:4px;font:12.5px/1.5 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink2);overflow-wrap:anywhere}
.gdt{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;color:var(--meta)}
.gdt:hover{color:var(--ink)}
.gdt .ic{width:12px;height:12px;transition:transform .15s}
.gdt[aria-expanded=true] .ic{transform:rotate(90deg)}
.gpre{margin-top:8px;max-height:240px;overflow:auto;border-radius:6px;background:var(--code);padding:12px;font:12px/1.5 ui-monospace,"SF Mono",Menlo,monospace;white-space:pre;color:var(--ink)}
.gacts{display:flex;align-items:center;gap:8px;padding:4px 16px 12px}
.gb{height:32px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.gb.pri{background:var(--accent-fill);color:#fff}
.gb.pri:hover{filter:brightness(1.08)}
.gb.out{border-color:var(--hair2);background:var(--card);color:var(--ink)}
.gb.out:hover{background:var(--hover)}
.gb.dan{background:color-mix(in srgb,var(--red) 11%,transparent);color:var(--red)}
.gb.dan:hover{background:color-mix(in srgb,var(--red) 19%,transparent)}
.gb.grow{flex:1}
.gb .grule{font:12px ui-monospace,"SF Mono",Menlo,monospace;background:var(--code);border-radius:4px;padding:1px 5px;color:var(--ink2)}
.gb:disabled{opacity:.5;cursor:default;filter:none}
.gplan{max-height:300px;overflow:auto;border-top:1px solid var(--hair);padding:12px 16px;font-size:14px;line-height:22px}
.gplan h4{font-size:14px;font-weight:600;margin:0 0 6px}
.gplan ol{margin:0;padding-left:20px}
.gplan li+li{margin-top:2px}
.gctl{margin:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;border:1px solid var(--hair);background:var(--q);border-radius:8px;padding:10px 12px}
.gctl .sp{flex:1}
.gseg{display:inline-flex;gap:2px;border:1px solid var(--hair);background:var(--chip);border-radius:8px;padding:2px}
.gseg button{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:4px 10px;min-height:24px;font-size:12px;font-weight:600;color:var(--meta)}
.gseg button:hover{color:var(--ink)}
.gseg button .ic{width:12px;height:12px}
.gseg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1);color:var(--accent-ink)}
.gseg button[aria-pressed=true].w{color:var(--warn)}
.gseg button[aria-pressed=true].d{color:var(--red)}
.gchk{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--meta);cursor:pointer}
.gchk input{width:16px;height:16px;margin:0;accent-color:var(--accent-fill)}
.gfb{width:100%;resize:none;border-radius:8px;border:1px solid var(--hair2);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;padding:8px 10px}
.gfb:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.grev{display:flex;flex-direction:column;gap:8px;padding:0 16px 12px}
.grev .row{display:flex;justify-content:flex-end;gap:8px}
.gq{padding:0 16px 4px 50px;font-size:14px;color:var(--ink)}
.gopts{display:flex;flex-direction:column;gap:8px;padding:4px 16px 12px}
.gopt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:44px;border-radius:8px;border:1px solid var(--hair2);padding:10px 12px;font-size:14px;color:var(--ink)}
.gopt:hover{background:var(--hover)}
.gopt[aria-checked=true]{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--q)}
.gopt .rd{width:16px;height:16px;margin-top:2px;flex:none;border-radius:50%;border:1px solid var(--hair2);display:grid;place-items:center}
.gopt[aria-checked=true] .rd{background:var(--accent-fill);border-color:var(--accent-fill)}
.gopt[aria-checked=true] .rd:after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.gopt b{display:block;font-weight:500}
.gopt small{display:block;font-size:12px;color:var(--meta);margin-top:1px}
.gother{width:100%;height:32px;border-radius:8px;border:1px solid var(--hair2);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;padding:0 10px}
.div .okic{color:var(--ok)}
/* T1g: markers. Skills, plans, schedules, monitors, worktree operations and notifications are centred pills on the
   spine, outside the folded work, in the order they happened; a pill with content opens a card under it. */
.mks{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px}
.mk{display:flex;justify-content:center}
.mkp{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:13px;box-shadow:inset 0 0 0 1px var(--hair);background:var(--card);font-size:12.5px;color:var(--meta);max-width:100%;min-width:0}
.mkp:not(:disabled):hover{background:var(--hover);color:var(--ink2)}
.mkp:disabled{opacity:1;cursor:default}
.mkp:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mkp>.ic{width:14px;height:14px;flex:none}
.mkp .mkl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mkp .mkl b{font-weight:500;color:var(--ink2)}
.mkp .mkl b.mono{font:12px ui-monospace,"SF Mono",Menlo,monospace}
.mkp .mkv{display:inline-flex;align-items:center;gap:4px;flex:none;font-variant-numeric:tabular-nums}
.mkp .mkv::before{content:"·";margin-right:2px}
.mkp .mkc{transition:transform .15s;flex:none}
.mk.open .mkc{transform:rotate(90deg)}
.mk.flash .mkp{animation:tcflash 2.2s ease-out}
.mkb{display:none;width:100%;max-width:600px;margin:2px auto 4px;box-sizing:border-box;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hair);background:var(--card);padding:10px 14px;font-size:13.5px}
.mk.open+.mkb{display:block}
.mkb .ans{font-size:13.5px}
.mkb .ans>:first-child{margin-top:0}.mkb .ans>:last-child{margin-bottom:0}
/* An answered question stays outside the work, as the record of what you chose. */
.qa{align-self:stretch;max-width:600px;margin:2px auto;width:100%;box-sizing:border-box;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hair);background:var(--card);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.qa .qah{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--meta)}
.qa .qah .ic{width:14px;height:14px}
.qa .qat{font-size:13.5px;font-weight:500;color:var(--ink)}
.qa .qaa{display:flex;flex-wrap:wrap;gap:6px}
.qa .qan{margin:0;font-size:12.5px;color:var(--meta)}
/* Question card rhythm (G4, picked in Live mode): the question is the title, its context sits under it,
   options and actions align to the text column, rows are compact. */
.gcq .gqh{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 10px}
.gcq .gqh .gtile{margin-top:1px}
.gcq .gqt{flex:1;min-width:0}
.gcq .gqt h3{font-size:14px;line-height:20px;font-weight:600;color:var(--ink);margin:0}
.gcq .gqc{display:block;margin-top:2px;font-size:12px;color:var(--meta)}
.gcq .gopts{gap:6px;padding:0 16px 12px 50px}
.gcq .gopt{min-height:0;gap:10px;padding:8px 12px}
.gcq .gopt b{font-size:13.5px;display:inline}
.gcq .gopt small{display:block}
.gcq .gopt .rd{border-color:var(--meta)}
.gcq .gopt[aria-checked=true] .rd{border:5px solid var(--accent-fill);background:none}
.gcq .gopt[aria-checked=true] .rd:after{display:none}
.gcq .grec{margin-left:6px;font-size:11px;font-weight:500;color:var(--accent-ink)}
.gcq .gacts{padding:0 16px 14px 50px}
/* Keyboard shortcuts sheet (⌘/), today's ShortcutsCheatSheet */
.kscrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.32)}
.ksheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:91;width:min(448px,calc(100vw - 32px));max-height:90vh;display:flex;flex-direction:column;background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--hair),var(--shadow-menu)}
.ksheet .kh{display:flex;align-items:center;gap:6px;padding:12px 8px 12px 16px;border-bottom:1px solid var(--hair);font-size:14px;font-weight:600}
.ksheet .kh .ic{width:14px;height:14px;color:var(--accent-ink)}
.ksheet .kh h2{font-size:14px;font-weight:600;flex:1}
.ksheet .kb{overflow-y:auto;padding:8px}
.ksheet h3{font-size:12px;font-weight:500;color:var(--meta);padding:8px 8px 4px}
.krow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 8px;border-radius:6px;font-size:13.5px}
.krow:hover{background:var(--hover)}
.krow kbd{flex:none;font:12px ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink2);background:var(--q);border:1px solid var(--hair);border-radius:4px;padding:1px 5px}
/* Tool rows (T1, the transcript proposal's "one row for every tool"): glyph, verb, target, where, receipt,
   action, chevron. A row with a body is one button; its body opens 24 px in, child steps get a guide line. */
.tc{display:flex;flex-direction:column;min-width:0}
.tcr{position:relative;display:flex;align-items:center;gap:8px;min-height:26px;margin:0 -6px;padding:0 6px;border-radius:6px;font-size:13px;color:var(--ink2);min-width:0}
.tct{position:absolute;inset:0;border-radius:6px}
.tct:hover{background:var(--hover)}
.tct:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tcr>*:not(.tct){position:relative;pointer-events:none}
.tcr>.tca{pointer-events:auto}
.tcr>.ic{width:14px;height:14px;color:var(--meta)}
.tcr>.ic.ok{color:var(--ok)}.tcr>.ic.bad{color:var(--fail)}.tcr>.ic.warn{color:var(--warn)}.tcr>.ic.runic{color:var(--live)}
.tcr .tv{flex:none;white-space:nowrap;color:var(--ink2)}
.tcr .tv.b{font-weight:500;color:var(--ink)}
.tcr .tg{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:var(--ink)}
.tcr .tg.sans{font-family:inherit;font-size:13px;color:var(--meta)}
.tcr .twhere{flex:none;color:var(--meta);white-space:nowrap}
.tcr .tsp{flex:1 1 0;min-width:4px}
.tcr .tm{flex:none;font-size:12px;color:var(--meta);font-variant-numeric:tabular-nums;white-space:nowrap}
.tcr .tm.bad{color:var(--fail);font-weight:400}.tcr .tm.warn{color:var(--warn);font-weight:500}
.tcr .tm .add{color:var(--ok)}.tcr .tm .del{color:var(--red)}
.tcr .tca{width:24px;height:24px;margin:0 -4px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--meta)}
.tcr .tca:hover{background:var(--press);color:var(--ink)}
.tcr .tca .ic{width:14px;height:14px}
.tcr .tch{width:12px;height:12px;flex:none;color:var(--meta);transition:transform .15s}
.tc.open>.tcr .tch{transform:rotate(90deg)}
.tcb,.tck{display:none;min-width:0}
.tc.open>.tcb{display:block;margin:2px 0 8px 22px}
.tc.open>.tck{display:flex;flex-direction:column;margin:1px 0 4px 7px;border-left:1px solid var(--hair);padding:1px 0 1px 15px}
.tck>.tsay,.wrows>.tsay{margin:4px 0}
.tsay{font-size:13px;line-height:20px;color:var(--ink);margin:0}
.tdesc{font-size:12px;color:var(--meta);margin:0 0 6px}
.tnote{font-size:12px;color:var(--meta)}

/* ================= turns ================= */
function slug(t){return t.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,3).join('-')||'session'}
function startTurn(m){
  S.msgs.push({k:'user',t:m.text,att:m.att&&m.att.length?m.att:null,time:new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})});
  if(!S.firstSent){
    S.firstSent=true;
    S.title=m.text.length>40?m.text.slice(0,38).trim()+'…':m.text;
    const e=S.env;
    if(e.kind==='new') S.env={kind:'worktree',branch:'mf/'+slug(m.text),from:S.base};
    else if(e.kind==='existing') S.env={kind:'worktree',branch:e.branch,from:e.from||'main'};
    else if(e.kind==='local') S.env={kind:'local',branch:S.base};
    renderSide();renderHead();renderTop();renderBottom();
  }
  S.running=true;S.stopping=false;S.live='Working on it…';S.ctx=Math.min(99,S.ctx+2);
  renderThread();updateToolbar();renderSide();
  clearTimeout(T.run);T.run=setTimeout(finishRun,4000);
}
function finishRun(){
  S.msgs.push({k:'agent',h:'<p>'+REPLIES[replyI++%REPLIES.length]+'</p>',time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});
  S.running=false;
  const next=S.queue.shift();
  if(next){delete next.failed;renderQueue();startTurn(next);return}
  renderThread();renderSide();updateToolbar();
}
function submit(mode){
  const text=ta.value.trim();
  if(!text&&!S.att.length) return;
  if(S.stopping) return;
  if(S.running){
    if(!text) return;
    if(mode==='steer'){
      /* Steer: the message joins the running turn; the agent reads it at its next step and keeps going. */
      S.msgs.push({k:'user',t:text,att:S.att.length?S.att.slice():null,steer:true,time:new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})});
      S.att=[];ta.value='';renderAtt();renderThread();sync();toast('Added to the running turn');return;
    }
    S.queue.push({text,att:S.att.slice()});S.att=[];ta.value='';renderQueue();renderAtt();sync();return;
  }
  const att=S.att.slice();S.att=[];ta.value='';
  renderAtt();startTurn({text:text||'(attachment)',att});
}
/* Sub-agents the composer's Stop ends: running ones, and those waiting on a gate. */
const stoppableSubs=()=>(S&&S.act||[]).filter(a=>a.k==='run'||(a.k==='need'&&a.agent));
function stopSubs(){const n=stoppableSubs().length;if(n){S.act=S.act.filter(a=>!(a.k==='run'||(a.k==='need'&&a.agent)));if(S.openGate) S.openGate=null;renderTop();renderGate();renderPanel()}return n}
function stop(){
  if(S.stopping) return;
  if(!S.running){const n=stopSubs();if(n){S.msgs.push({k:'marker',t:`Stopped ${n} sub-agent${n>1?'s':''}`});renderThread();renderSide();updateToolbar();ta.focus()}return}
  S.stoppedSubs=stopSubs();
  S.stopping=true;renderThread();updateToolbar();
  clearTimeout(T.run);clearTimeout(T.stop);
  T.stop=setTimeout(finishStop,S.stopMs||1200);
}
function finishStop(){
  const n=S.stoppedSubs||0;S.stoppedSubs=0;
  S.running=false;S.stopping=false;S.msgs.push({k:'marker',t:n?`Stopped · ${n} sub-agent${n>1?'s':''} stopped`:'Stopped'});
  const had=document.activeElement;
  renderThread();renderQueue();renderSide();updateToolbar();
  if(!had||had===document.body||had===B.stopx||!had.isConnected) ta.focus();
}
function sendNow(i){
  const next=S.queue.splice(i,1)[0];renderQueue();

}

function load(id,mods={},o={}){
  clearTimers();closeMenu(false);closeConfirm(false);hideTip();ACT_CONFIRM=null;gateReset();
  S=Object.assign(clone(TPL[id]),mods);
  S.open={};
  if(!UI.tabs.includes(id)){UI.tabs.push(id);if(UI.tabs.length>4) UI.tabs.splice(UI.tabs.findIndex(t=>t!==id),1)}
  ta.value=S.text||'';
  S.queue.forEach(q=>delete q.failed);
  if(o.panel!==undefined){UI.panel=o.panel;UI.pfloat=false}
  if(o.pfloat) UI.pfloat=true;
  if(o.ws!==undefined){WS.files=!!o.wsFiles;setWs(o.ws,{instant:true,quiet:true});if(o.wsTab) wsScope().active=o.wsTab}
  if(o.cw!==undefined) setCw(o.cw);
  renderAll();$('#spanel').scrollTop=0;
  if(S.running&&S.autoEnd&&!S.stopping) T.run=setTimeout(finishRun,S.endIn||40000);
  if(S.stopping){clearTimeout(T.stop);T.stop=setTimeout(finishStop,6000)}
  if(o.focus) ta.focus();else if(document.activeElement===ta) ta.blur();
  thread.scrollTop=id==='s12'?0:thread.scrollHeight;
  if(o.after) setTimeout(o.after,30);
}

/* ================= overlay scrollbars (S3) ================= */
(()=>{
  const TH=new Map();const PAD=2,W=6,WH=8,MIN=24;
  const scrolls=(el,ax)=>{if(!(el instanceof Element)) return false;const cs=getComputedStyle(el),o=ax==='y'?cs.overflowY:cs.overflowX;
    return (o==='auto'||o==='scroll')&&(ax==='y'?el.scrollHeight>el.clientHeight+1:el.scrollWidth>el.clientWidth+1)};
  function thumb(el,ax){const k=TH.get(el)||{};if(k[ax]) return k[ax];
    const t=document.createElement('div');t.className='osb';t.setAttribute('aria-hidden','true');document.body.appendChild(t);
    t.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();t.setPointerCapture(e.pointerId);t.classList.add('drag');
      const st=ax==='y'?el.scrollTop:el.scrollLeft,p0=ax==='y'?e.clientY:e.clientX,r=el.getBoundingClientRect();
      const view=ax==='y'?el.clientHeight:el.clientWidth,full=ax==='y'?el.scrollHeight:el.scrollWidth,len=Math.max(MIN,view*view/full);
      const k2=(full-view)/Math.max(1,(ax==='y'?r.height:r.width)-2*PAD-len);
      const mv=ev=>{const d=((ax==='y'?ev.clientY:ev.clientX)-p0)*k2;if(ax==='y') el.scrollTop=st+d;else el.scrollLeft=st+d};
      const up=()=>{t.classList.remove('drag');t.removeEventListener('pointermove',mv);t.removeEventListener('pointerup',up);t.removeEventListener('pointercancel',up);hide(el,900)};
      t.addEventListener('pointermove',mv);t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up)});
    t.addEventListener('pointerenter',()=>show(el));t.addEventListener('pointerleave',()=>hide(el,900));
    k[ax]=t;TH.set(el,k);return t}
  function place(el){const k=TH.get(el);if(!k) return;
    if(!el.isConnected){Object.values(k).forEach(t=>t.remove());TH.delete(el);return}
    const r=el.getBoundingClientRect();
    for(const ax of ['y','x']){const t=k[ax];if(!t) continue;
      const ok=scrolls(el,ax)&&r.width>0&&r.height>0;t.hidden=!ok;if(!ok) continue;
      const view=ax==='y'?el.clientHeight:el.clientWidth,full=ax==='y'?el.scrollHeight:el.scrollWidth,pos=ax==='y'?el.scrollTop:el.scrollLeft;
      const track=(ax==='y'?r.height:r.width)-2*PAD,len=Math.max(MIN,track*view/full),off=PAD+(track-len)*(pos/Math.max(1,full-view));
      const big=t.matches(':hover')||t.classList.contains('drag');
      if(ax==='y') Object.assign(t.style,{top:r.top+off+'px',left:r.right-PAD-(big?WH:W)+'px',width:(big?WH:W)+'px',height:len+'px'});
      else Object.assign(t.style,{left:r.left+off+'px',top:r.bottom-PAD-(big?WH:W)+'px',height:(big?WH:W)+'px',width:len+'px'})}}
  function show(el){for(const ax of ['y','x']) if(scrolls(el,ax)) thumb(el,ax);place(el);const k=TH.get(el);if(!k) return;
    clearTimeout(k.tm);Object.values(k).forEach(t=>t instanceof Element&&t.classList.add('on'))}
  function hide(el,ms){const k=TH.get(el);if(!k) return;clearTimeout(k.tm);
    k.tm=setTimeout(()=>{if(el.matches(':hover')||Object.values(k).some(t=>t instanceof Element&&(t.matches(':hover')||t.classList.contains('drag')))) return hide(el,600);
      Object.values(k).forEach(t=>t instanceof Element&&t.classList.remove('on'))},ms)}
  const scrollerAt=n=>{for(let e=n;e&&e!==document.documentElement;e=e.parentElement) if(scrolls(e,'y')||scrolls(e,'x')) return e;return null};
  document.addEventListener('scroll',e=>{const el=e.target;if(el instanceof Element&&!el.classList.contains('osb')){show(el);hide(el,900)}},true);
  let hov=null,raf=0;
  document.addEventListener('pointermove',e=>{if(raf) return;raf=requestAnimationFrame(()=>{raf=0;
    if(e.target instanceof Element&&e.target.classList.contains('osb')) return;
    const el=scrollerAt(e.target);if(el!==hov){if(hov) hide(hov,600);hov=el}if(el) show(el)})},{passive:true});
  document.addEventListener('pointerleave',()=>{if(hov) hide(hov,300);hov=null});
  const relayout=()=>TH.forEach((_,el)=>place(el));
  addEventListener('resize',relayout);new ResizeObserver(relayout).observe(document.body);
  new MutationObserver(()=>requestAnimationFrame(relayout)).observe(document.body,{childList:true,subtree:true});
})();
