[package]
name = "mainframe-automations"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Exposes `testkit` (shared port fakes) to integration tests and other crates.
# Never enable it outside dev-dependencies.
testkit = []

[lints]
workspace = true

[dependencies]
mainframe-runtime = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
nanoid = { workspace = true }
tracing = { workspace = true }
keyring = { workspace = true }
mainframe-types = { workspace = true }
mainframe-github = { workspace = true }

[dev-dependencies]
mainframe-automations = { workspace = true, features = ["testkit"] }
hmac = { workspace = true }
sha2 = { workspace = true }
chrono-tz = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
