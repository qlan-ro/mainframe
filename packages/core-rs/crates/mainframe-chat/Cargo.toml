[package]
name = "mainframe-chat"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = ["mainframe-runtime/test-support", "dep:mainframe-adapter-claude"]

[dependencies]
mainframe-adapter-claude = { workspace = true, optional = true }
tokio = { workspace = true }
dashmap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
nanoid = { workspace = true }
dirs = { workspace = true }
mainframe-types = { workspace = true }
mainframe-db = { workspace = true }
mainframe-runtime = { workspace = true }
mainframe-adapter-api = { workspace = true }
mainframe-display = { workspace = true }
mainframe-services = { workspace = true }
mainframe-background-tasks = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mainframe-runtime = { workspace = true, features = ["test-support"] }
mainframe-adapter-claude = { workspace = true }
