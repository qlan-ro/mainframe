[package]
name = "mainframe-runtime"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test-only `log_capture` module, enabled from the [dev-dependencies] entries
# of mainframe-chat and mainframe-server (resolver = "2" keeps a dev-dependency
# feature out of release builds of the *depending* crate's own lib target).
test-support = []

[dependencies]
mainframe-types = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
